name: Embers
options:
  bundleIdPrefix: app.embers
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Embers:
    type: application
    platform: macOS
    sources:
      - Sources/Embers
      - path: Resources/games.json
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.embers.questrunner
        PRODUCT_NAME: Embers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Embers
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    postCompileScripts:
      - name: Build fakegame helper
        script: |
          clang -O2 -fobjc-arc -framework Cocoa -mmacosx-version-min=13.0 -o "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fakegame" "${SRCROOT}/Helper/fakegame.m"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/fakegame
